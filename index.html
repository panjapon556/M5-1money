<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบห้อง 5/1 - Full Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Kanit', sans-serif; background: #f1f5f9; }</style>
</head>
<body class="pb-20">

    <!-- Header & Dashboard Summary -->
    <header class="bg-indigo-900 text-white p-6 shadow-xl">
        <div class="max-w-xl mx-auto flex justify-between items-center mb-6">
            <h1 class="font-bold text-xl">Classroom 5/1</h1>
            <button onclick="document.getElementById('admin-login').classList.remove('hidden')" id="login-btn" class="text-xs bg-indigo-700 px-3 py-1 rounded-full"><i class="fa-solid fa-lock mr-1"></i> Admin</button>
        </div>
        <!-- Dashboard Summary -->
        <div class="max-w-xl mx-auto grid grid-cols-2 gap-4">
            <div class="bg-white/10 p-4 rounded-2xl backdrop-blur">
                <p class="text-[10px] uppercase text-indigo-200">งานค้างส่ง</p>
                <h3 class="text-2xl font-bold">0 <span class="text-xs">รายการ</span></h3>
            </div>
            <div class="bg-white/10 p-4 rounded-2xl backdrop-blur">
                <p class="text-[10px] uppercase text-indigo-200">เงินคงเหลือ</p>
                <h3 class="text-2xl font-bold">฿0</h3>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-6">
        <!-- Tabs -->
        <div class="flex gap-2 overflow-x-auto text-xs pb-2">
            <button onclick="show('hw')" class="tab bg-indigo-600 text-white px-4 py-2 rounded-xl">การบ้าน</button>
            <button onclick="show('finance')" class="tab bg-white px-4 py-2 rounded-xl">เงินห้อง</button>
            <button onclick="show('duty')" class="tab bg-white px-4 py-2 rounded-xl">เวร</button>
            <button onclick="show('chat')" class="tab bg-white px-4 py-2 rounded-xl">แชท</button>
        </div>

        <!-- Sections -->
        <section id="hw" class="tab-content">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold">รายการการบ้าน</h2>
                <button onclick="alert('แอดมินเท่านั้น')" class="admin-only hidden bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs">+ เพิ่มการบ้าน</button>
            </div>
            <div class="bg-white p-4 rounded-2xl border text-sm text-center py-10">ยังไม่มีการบ้าน</div>
        </section>

        <section id="finance" class="tab-content hidden">
            <h2 class="font-bold mb-3">บัญชีรายรับ-รายจ่าย</h2>
            <div class="bg-white p-4 rounded-2xl border mb-3">
                <table class="w-full text-xs text-left">
                    <thead><tr class="border-b"><th class="py-2">รายการ</th><th class="py-2 text-right">จำนวน</th></tr></thead>
                    <tbody id="fin-table"></tbody>
                </table>
            </div>
            <button class="admin-only hidden w-full bg-emerald-600 text-white p-2 rounded-xl text-xs">+ บันทึกรายรับ/รายจ่าย</button>
        </section>

        <section id="duty" class="tab-content hidden">
            <h2 class="font-bold mb-3">เวรประจำวัน</h2>
            <div class="grid grid-cols-5 gap-2 text-center text-[10px]">
                <div class="bg-white p-2 rounded-xl border">จันทร์<ul class="mt-2"><li>-</li></ul></div>
                <div class="bg-white p-2 rounded-xl border">อังคาร<ul class="mt-2"><li>-</li></ul></div>
                <div class="bg-white p-2 rounded-xl border">พุธ<ul class="mt-2"><li>-</li></ul></div>
                <div class="bg-white p-2 rounded-xl border">พฤหัสบดี<ul class="mt-2"><li>-</li></ul></div>
                <div class="bg-white p-2 rounded-xl border">ศุกร์<ul class="mt-2"><li>-</li></ul></div>
            </div>
            <button class="admin-only hidden w-full mt-4 bg-amber-500 text-white p-2 rounded-xl text-xs">แก้ไขตารางเวร</button>
        </section>

        <section id="chat" class="tab-content hidden">
            <div class="bg-white h-60 rounded-2xl border p-4 overflow-y-auto mb-2"></div>
            <form class="flex gap-2"><input type="text" placeholder="ข้อความ..." class="flex-1 p-2 border rounded-xl text-xs"><button class="bg-indigo-600 text-white px-4 rounded-xl text-xs">ส่ง</button></form>
        </section>
    </main>

    <!-- Admin Login -->
    <div id="admin-login" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm">
            <h3 class="font-bold mb-4">เข้าสู่ระบบ Admin</h3>
            <input type="password" id="pin" placeholder="รหัสผ่าน 2552" class="w-full p-3 border rounded-xl mb-4 text-center text-lg tracking-widest">
            <button onclick="checkAdmin()" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold">ยืนยัน</button>
        </div>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function checkAdmin() {
            if(document.getElementById('pin').value === '2552') {
                document.querySelectorAll('.admin-only').forEach(e => e.classList.remove('hidden'));
                document.getElementById('admin-login').classList.add('hidden');
                alert('ยินดีต้อนรับ Admin!');
            } else { alert('รหัสผิด'); }
        }
    </script>
</body>
</html>
