<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเงินห้อง ม.5/1</title>
    <!-- Tailwind CSS สำหรับจัดสไตล์ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header / Navbar -->
    <nav class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-wallet"></i> คลังเงินห้อง ม.5/1
        </h1>
        <div class="flex gap-2">
            <button class="bg-blue-800 hover:bg-blue-900 px-3 py-1.5 rounded-lg text-sm flex items-center gap-1">
                <i class="fa-solid fa-user"></i> ทั่วไป
            </button>
            <!-- ปุ่ม Admin ที่ผูก onclick เรียบร้อย -->
            <button onclick="openAdminModal()" class="bg-amber-400 hover:bg-amber-500 text-gray-900 font-semibold px-3 py-1.5 rounded-lg text-sm flex items-center gap-1 transition">
                <i class="fa-solid fa-lock"></i> Admin
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="max-w-4xl mx-auto p-4 space-y-4">
        
        <!-- Dashboard Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500">ยอดเก็บสัปดาห์นี้</p>
                <p class="text-xl font-bold text-blue-600">0 บาท</p>
                <p class="text-xs text-gray-400">เป้า: 0 บ.</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500">ชำระแล้ว</p>
                <p class="text-xl font-bold text-emerald-600">0 / 35</p>
                <p class="text-xs text-gray-400">0%</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500">ค้างชำระ</p>
                <p class="text-xl font-bold text-rose-500">0 คน</p>
                <p class="text-xs text-gray-400">ค้าง: 0 บ.</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500">อัตราต่อสัปดาห์</p>
                <p class="text-xl font-bold text-gray-800">25 บ./คน</p>
                <p class="text-xs text-gray-400">(5 วัน × 5 บาท)</p>
            </div>
        </div>

        <!-- Filter & Search Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
            <div class="flex flex-col md:flex-row gap-3">
                <select id="weekSelect" class="border border-gray-300 rounded-lg p-2 text-sm w-full md:w-48 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="1">สัปดาห์ที่ 1</option>
                    <option value="2">สัปดาห์ที่ 2</option>
                    <option value="3">สัปดาห์ที่ 3</option>
                    <option value="4">สัปดาห์ที่ 4</option>
                </select>
                <div class="relative w-full">
                    <input type="text" placeholder="ค้นหาชื่อนักเรียน..." class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                </div>
                <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm flex items-center justify-center gap-1 font-medium min-w-max">
                    <i class="fa-solid fa-file-csv"></i> Export CSV
                </button>
            </div>

            <!-- Tabs Filter -->
            <div class="flex gap-2 border-t pt-3">
                <button class="bg-blue-100 text-blue-700 font-medium px-3 py-1 rounded-full text-xs">รายชื่อ (35 คน)</button>
                <button class="text-gray-500 hover:bg-gray-100 px-3 py-1 rounded-full text-xs">ทั้งหมด</button>
                <button class="text-gray-500 hover:bg-gray-100 px-3 py-1 rounded-full text-xs">จ่ายแล้ว</button>
                <button class="text-gray-500 hover:bg-gray-100 px-3 py-1 rounded-full text-xs">ค้างชำระ</button>
            </div>
        </div>

    </div>

    <!-- Admin Password Modal (กล่องป๊อบอัปล็อกอิน) -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 space-y-4 transform transition-all">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-amber-500"></i> เข้าสู่ระบบ Admin
                </h3>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700">รหัสผ่านสำหรับผู้ดูแลระบบ:</label>
                <input type="password" id="adminPasswordInput" placeholder="กรอกรหัสผ่าน (เช่น 1234)" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
                <p id="errorMessage" class="text-xs text-rose-500 hidden">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</p>
            </div>

            <div class="flex gap-2 justify-end pt-2">
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200">ยกเลิก</button>
                <button onclick="verifyAdminPassword()" class="px-4 py-2 bg-amber-400 hover:bg-amber-500 text-gray-900 font-bold rounded-lg text-sm">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Control Section -->
    <script>
        let isAdminLoggedIn = false;

        // ฟังก์ชั่นเปิด Modal ล็อกอิน
        function openAdminModal() {
            if (isAdminLoggedIn) {
                alert("คุณอยู่ในระบบ Admin เรียบร้อยแล้ว");
                return;
            }
            const modal = document.getElementById('adminModal');
            const input = document.getElementById('adminPasswordInput');
            const errorMsg = document.getElementById('errorMessage');
            
            input.value = '';
            errorMsg.classList.add('hidden');
            modal.classList.remove('hidden');
            input.focus();
        }

        // ฟังก์ชั่นปิด Modal
        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        // ฟังก์ชั่นตรวจสอบรหัสผ่าน
        function verifyAdminPassword() {
            const input = document.getElementById('adminPasswordInput').value;
            const errorMsg = document.getElementById('errorMessage');

            if (input === '1234') {
                isAdminLoggedIn = true;
                closeAdminModal();
                alert('ล็อกอินเข้าสู่ระบบ Admin สำเร็จ!');
                // สามารถเพิ่มโค้ดเปิดใช้งานฟีเจอร์ Admin ตรงนี้ได้
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        // ให้กด Enter ในช่องรหัสผ่านเพื่อล็อกอินได้
        document.getElementById('adminPasswordInput')?.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                verifyAdminPassword();
            }
        });
    </script>
</body>
</html>
